name: Release zip

# For PowerShell and HTML projects. Ships everything in src/ plus READ_ME_FIRST.txt.
# Trigger: push a tag like v1.2.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          NAME="${GITHUB_REPOSITORY#*/}"
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out/pkg
          cp READ_ME_FIRST.txt out/pkg/
          cp -r src/. out/pkg/
          (cd out/pkg && zip -r "../${NAME}-${VERSION}-Windows.zip" .)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
