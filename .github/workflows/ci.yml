name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rules:
    name: AGENTS.md and CLAUDE.md identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmp AGENTS.md CLAUDE.md

  pr-format:
    name: Branch name and title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name and pull request title
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          ok=1
          if ! printf '%s' "$BRANCH" | grep -Eq '^(feat|fix|docs|debug)/[a-z0-9][a-z0-9-]*$'; then
            echo "Branch '$BRANCH' must be feat/, fix/, docs/ or debug/ plus a short lowercase slug (AGENTS.md section 6)."
            ok=0
          fi
          if ! printf '%s' "$TITLE" | grep -Eq '^(Added|Changed|Fixed|Removed|Security)!?: .+'; then
            echo "Title '$TITLE' must start with Added:, Changed:, Fixed:, Removed: or Security: (add ! for breaking) (AGENTS.md section 6)."
            ok=0
          fi
          [ "$ok" = 1 ]

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Serve and test
        run: |
          python3 -m http.server 8000 &
          sleep 1
          npm run smoke
